name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        # Pull the repository contents so the build step can run from the app folder.
        uses: actions/checkout@v5

      - name: Setup Node.js
        # Use a modern Node runtime for Next.js builds and to avoid the Node 20 deprecation path.
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'my-clock/package-lock.json'

      - name: Install dependencies
        # Install the app dependencies before running the production build.
        working-directory: ./my-clock
        run: npm install

      - name: Build
        # Next is configured for static export, so this produces the final out/ directory.
        working-directory: ./my-clock
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: npm run build

      - name: Setup Pages
        # Prepare GitHub Pages metadata for an artifact-based deploy.
        uses: actions/configure-pages@v5

      - name: Upload artifact
        # Upload the generated static site so GitHub can publish it as Pages content.
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./my-clock/out

      - name: Deploy
        # Publish the uploaded artifact to the Pages environment.
        id: deployment
        uses: actions/deploy-pages@v4

